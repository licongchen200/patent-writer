version: '3.8'

services:
  patent-writer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patent-writer
    environment:
      # API Keys - Set these in your .env file
      - SERPER_API_KEY=${SERPER_API_KEY}
      # Internal LLM Proxy (Comcast k8s)
      - OPENAI_API_BASE=${OPENAI_API_BASE:-http://llm-proxy.ceui.cnap.comcast.net}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy-key-not-needed}
      # Optional: Use different LLM providers or models
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # Mount output directory to persist generated files
      - ./output:/app/output
      # Optional: Mount source code for live editing
      - ./main.py:/app/main.py
    stdin_open: true  # Keep STDIN open for interactive input
    tty: true         # Allocate a pseudo-TTY for interactive mode
    env_file:
      - .env  # Load environment variables from .env file
